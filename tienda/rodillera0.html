 t=t.replace(/<sc-for list="\{\{\s*([\w.]+)\s*\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,function(m,l,as,inner){return (get(c,l)||[]).map(function(it){var n=Object.assign({},c);n[as]=it;return rend(inner,n)}).join('')});

 return t.replace(/\{\{\s*([\w.]+)\s*\}\}/g,function(m,p){var v=get(c,p);if(typeof v==='function'){H.push(v);return 'h'+(H.length-1)}return v==null?'':esc(v)});
