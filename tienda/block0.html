<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[id^="ns-section-custom_"]{padding:0!important;margin:0!important;max-width:none!important}
[id^="ns-section-custom_"] .container,[id^="ns-section-custom_"] .row,[id^="ns-section-custom_"] [class*="col"]{max-width:none!important;padding-left:0!important;padding-right:0!important;margin-left:0!important;margin-right:0!important;width:100%!important}
.wh{font-family:'Barlow','Helvetica Neue',Arial,sans-serif;color:#0B0C0A;font-size:16px;line-height:1.5;text-align:left;width:100%}
.wh *,.wh *::before,.wh *::after{box-sizing:border-box}
.wh h1,.wh h2,.wh h3{text-transform:none;letter-spacing:normal}
.wh p{margin:0}
.wh img,.wh video{max-width:100%}
.wh a{color:inherit}
.wh .wd{display:none}
@media (min-width:768px){.wh .wm{display:none}.wh .wd{display:block}}
.wh a:focus-visible,.wh button:focus-visible,.wh summary:focus-visible{outline:3px solid #9BF609;outline-offset:3px}
.wh .press{transition:transform 140ms cubic-bezier(0.23,1,0.32,1)}.wh .press:active{transform:scale(0.97)}
.wh details>summary{list-style:none;cursor:pointer}.wh details>summary::-webkit-details-marker{display:none}
.wh details[open] .faq-plus{transform:rotate(45deg)}.wh .faq-plus{transition:transform 200ms cubic-bezier(0.23,1,0.32,1)}
.wh .btn-lime,.wh .btn-dark{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 160ms ease}
.wh .btn-lime:active,.wh .btn-dark:active{transform:scale(0.97)}
@media (hover:hover) and (pointer:fine){.wh .lime:hover,.wh .btn-lime:hover{background:#B4FF3C!important}.wh .btn-dark:hover{background:#262A20!important}}
@keyframes wslide{to{transform:translateX(-50%)}}.wh .slide{animation:wslide 24s linear infinite}.wh .slide:hover{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.wh .slide{animation:none}.wh .press,.wh .faq-plus{transition:none}}
body{padding-bottom:96px}
</style>
<script>
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-wj]');if(!a)return;var k=a.getAttribute('data-wj');var t=document.getElementById((window.innerWidth>=768?'d-':'m-')+k);if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth',block:'start'});}});
</script>
